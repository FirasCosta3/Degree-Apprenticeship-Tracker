<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DA Tracker</title>
    <link rel="icon" href="data:,">
    <link rel ="stylesheet" href="/static/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
<header>
    <nav class="navbar">
        <a id="removed-jobs" href ="{{ url_for('removed_jobs') }}">
            <svg id="bin-icon" xmlns="http://www.w3.org/2000/svg" width="24"height="24"viewBox="0 0 24 24"fill="none"stroke="currentColor"stroke-width="2"stroke-linecap="round"stroke-linejoin="round">
                <path d="M3 6h18"></path>
                <path d="M8 6V4h8v2"></path>
                <path d="M19 6l-1 14H6L5 6"></path>
                <path d="M10 11v5"></path>
                <path d="M14 11v5"></path>
            </svg>
        </a>
        <button id="add-job" class="main-font">Add a job</button>
        <div id="modal-backdrop">
            <div id="add-job-div">
                <div id="add-job-title">
                    <h1 id="add-title" class="main-font">Add a new job</h1>
                    <button type="button" id="add-job-cancel">
                        <svg id="x-icon-can" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
                        <path d="M8.5 8.5 L15.5 15.5 M15.5 8.5 L8.5 15.5" stroke="#EF4444" stroke-width="2" stroke-linecap="round" fill="none"/>
                        </svg>
                    </button>
                </div>
                <div id="add-form">
                    <form id="new-job-titles" novalidate>
                        <input id="job-title" class="main-font new-job-inputs" autocomplete="off" placeholder="Company name" type="text" required>
                        <input id="company-name" class="main-font new-job-inputs" placeholder="Job title" autocomplete="off" type="text" required>
                        <input id="locations" class="main-font new-job-inputs" autocomplete="off" placeholder="Location" type="text" required>
                        <input id="url" class="main-font new-job-inputs" autocomplete="off" placeholder="Url" type="text" required>
                        <p class="main-font" id="error-message">Dont leave any fields blank</p>
                        <button id="create-new-button" class="main-font" type="submit">Create new job</button>
                    </form>
                </div>  
            </div>
        </div>
        <p class="main-font" id="nav-title">DegreeApprenticeshipTracker</p>
        <div class="nav-counter">
            <p class="main-font" id="applied-counter"></p>
            <button type="button" class="minus-plus" id="plus-button">
                <svg class="shape" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="12" y1="5" x2="12" y2="19"></line>
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <button type="button" class="minus-plus" id="minus-button">
                <svg class="shape" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                    <line x1="5" y1="12" x2="19" y2="12"></line>
                </svg>
            </button>
            <p style="margin-left: 8px;" class="main-font"></p>
        </div>
    <div id="filters-division">
        <div id="filter-layout">
            <div id="filters">
                <p class="main-font" id="filter-head">Filters</p>
                <button type="button" id="filters-button">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="4" y1="6" x2="20" y2="6" />
                        <line x1="4" y1="12" x2="20" y2="12" />
                        <line x1="4" y1="18" x2="20" y2="18" />
                    </svg>
                </button>
                <div id="jobs-filters">
                    {%  for job_types in technology_list %}
                    <div id="jobs-select">
                        <p class="main-font job-titles" >{{ job_types }}</p>
                        <button type="button" class="filter-tick">
                            <svg class="tick-filter" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                                <polyline points="20 6 9 17 4 12"></polyline>
                            </svg>
                        </button>
                    </div>
                    {%  endfor %}
                </div>
            </div>
            <div id="jobs-div">
                <button type="button" class="main-font" id="submit-job">Search</button>
                <div id="button-div">
                    <button type="button" class="main-font" id="clear-search">Remove All</button>
                </div>
            </div>
        </div>
    </div>
    </nav>
</header>
<div id="main-jobs">
    {% for jobs in jobs_dict %} 
        <div class="jobs-display" data-id="{{ jobs[0] }}"  data-applied="{{ jobs[4] }}" data-jobs = '{{ [jobs[3], jobs[0], jobs[1], jobs[6], jobs[2]] | tojson }}'>
        <div id="jobs-details-div">
            <p class="main-font company company-p"> {{ jobs[3] }} </p>
            <input name = "companyName" class="company main-font company-input" value="{{ jobs[3] }}">
            <div id="head-div">
                <div id="location-div">
                    <p class="main-font location location-p"> {{ jobs[6] }} </p>
                    <input name = "location" class = "main-font location location-input" value = "{{ jobs[6] }}">
                </div>
                <button class="edit-button">
                    <svg class="edit-svg" xmlns="http://www.w3.org/2000/svg" height="30" width="30" viewBox="0 -960 960 960" fill="currentColor">
                        <path d="M200-200h57l391-391-57-57-391 391v57Zm-80 80v-170l528-527q12-11 26.5-17t30.5-6q16 0 31 6t26 18l55 56q12 11 17.5 26t5.5 30q0 16-5.5 30.5T817-647L290-120H120Zm640-584-56-56 56 56Zm-141 85-28-29 57 57-29-28Z"/>
                    </svg>
                    <svg class="confirm-edit" xmlns="http://www.w3.org/2000/svg" width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="20 6 9 17 4 12"></polyline>
                    </svg>
                </button>
            </div>
        </div>
        <div class="name-div">
            <button type="button" class="cancel-button">
                <svg id="x-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="32" height="32">
                  <path d="M8.5 8.5 L15.5 15.5 M15.5 8.5 L8.5 15.5" stroke="#EF4444" stroke-width="2" stroke-linecap="round" fill="none"/>
                </svg>
            </button>
            <div class="overlay">
                <div class="confirm">
                    <button type="button" class="cancel-b">
                        <svg id="cancel-icon" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                          <line x1="4" y1="4" x2="20" y2="20" style="stroke: black; stroke-width: 2; stroke-linecap: round;" />
                            <line x1="20" y1="4" x2="4" y2="20" style="stroke: black; stroke-width: 2; stroke-linecap: round;" />
                        </svg>
                    </button>
                    <p id="confirm-text" class="main-font">Click yes to remove this job</p>
                    <div id="yesno-div">
                        <button type="button" class="yes-no yes">Yes</button>
                        <button type="button" class="yes-no no">No</button>
                    </div>
                </div>
            </div>
            <h2 class="main-font job-name job-name-p">{{ jobs[1] }}</h2>
            <input name ="jobTitle" type = "text" class="job-name job-name-input main-font" value="{{ jobs[1] }}">
            <button type="button" class="tick-box">
                <svg class="tick" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="20 6 9 17 4 12"></polyline>
                </svg>
            </button>
            <a class="main-font apply-button apply-design" href="{{ jobs[2] }}" target="_blank">Apply here</a>
            <input name = "url" class="main-font apply-design apply-input" placeholder="Paste URL"> 
        </div>
    </div>
    {% endfor %}
</div>

</body>
<script src="{{ url_for('static', filename='crossfile.js') }}"></script>
<script src= "{{ url_for('static', filename='main.js') }}" ></script>
</html>
